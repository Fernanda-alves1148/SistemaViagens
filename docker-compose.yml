services:
  banco:
    image: postgres:16-alpine
    container_name: sistema-viagens-banco
    environment:
      POSTGRES_DB: sistema_viagens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_viagens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistema-viagens-backend
    environment:
      DB_URL: jdbc:postgresql://banco:5432/sistema_viagens
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados_postgres: