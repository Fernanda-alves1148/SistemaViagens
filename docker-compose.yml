services:
  banco:
    image: postgres:16-alpine
    container_name: sistema-viagens-banco
    environment:
      POSTGRES_DB: sistema_viagens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_viagens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados_postgres: